# taker-tickburst — v0 LIVE-FIRST configuration (POST-TWAP-SPEC).
# Copy to config/tickburst.toml (gitignored) and fill in [live.*] with THIS
# STRATEGY'S OWN wallet. Never share a wallet with another strategy.
# Collateral is pUSD (0xC011a7...), not USDC.e.
#
# NEVER run alongside another cheap-ask taker on btc-updown-5m: they race each
# other for the same cheap asks. Stop the other one first.
#
# The earlier keys are GONE, not defaulted — clip_mode, flat_clip_usd,
# slip_mult, max_entry_ask_usd, tick.dose_usd, kline_gap_disarm_ms. [strategy]
# is deny_unknown_fields, so an old TOML fails LOUDLY at parse rather than
# silently trading the new gate under stale numbers.

[strategy]
coin = "btc"

# ---------------------------------------------------------------------------
# THE ENTRY (spec §3.4, §3.7).
#
# The entry BAND, inclusive. Spec §3.4 is the 1c EQUALITY the census graded;
# 0.9c-1.1c is an OPERATOR WIDENING on top of it (2026-08-09). Measured over
# the same Aug 7-9 window, the widening is very nearly a no-op: one entry moves
# to an earlier, cheaper second (a loss either way), nothing is added or lost,
# the same 5 wins — and NO 1.1c ask qualified at all, so the upper half is
# inert in-sample. tests/posttwap_parity.rs pins BOTH: the engine against the
# graded 1c cell, and this band as its own measured cell.
#
# Still excluded, and why: 2c (57 first-moments, 0 winners, and the 2c FAK
# limit is race-tail optionality only); below 0.9c (the census's band floor is
# 0.95c, so it is unmeasured — and only 4 of 2,065 sub-1c slot-seconds carry a
# qualifying burst at all, so the pocket is nearly empty).
ask_price_min = 0.009
ask_price_max = 0.011

# The FAK's limit. Price priority fills at the standing 1c; the wider limit is
# free race-tail optionality, NOT permission to enter at 2c. The sweep that
# kills a 1c level crosses 2c within ~10-70ms of doing so, and our arrival is
# ~400ms behind the tick — a second attempt there added ~$570/2.4d of losers
# and converted ZERO races.
limit_price = 0.02

# A DOLLAR budget, literally: a fire commits EXACTLY this, because the order
# is sized `clip_usd / limit_price` shares (500 at the 2c limit) and a
# Polymarket BUY spends `shares x limit`. Price improvement comes back as
# EXTRA SHARES, not change — so the ask decides what the money BUYS (1,111 at
# 0.9c, 1,000 at 1c, 909 at 1.1c), never how much goes out. Sizing off the ask
# instead over-commits by limit/ask: an order for clip/ask shares commits
# clip x limit/ask dollars — 2.2x the clip at a 0.9c ask under a 2c limit.
# The venue's LIMIT minimum is 5 SHARES
# (not $5 of notional) and it is the SENT count, 500, that must clear it.
# A win pays ~+$989 net of the C=0.07 taker fee: break-even is a 1.07% win
# rate against a measured 5/98 in-band rate. Raise the clip ALONE, and only
# after the live fill ratio is in — never bundled with a gate change.
clip_usd = 10.0

# Boundary-close reconstruction — DO NOT ENABLE. LEAVE THIS KEY ABSENT.
#   (internal measurement record, not included)
# It rebuilds the kline close ~152ms early, and under this spec klines feed
# TELEMETRY ONLY — so it cannot buy a decision anything, while its task still
# carries live defect D2. Deliberately left without a value: uncommenting the
# line is a TOML parse error, so the key fails closed.
# boundary_close_delay_ms =

# ---------------------------------------------------------------------------
# Risk rails. RAISE a rail, never shrink the clip (design §5.0) — a binding
# rail censors selectively and silently, which is a strategy change nobody
# approved.
#
# daily_spend_cap_usd is the rolling-24h COMMITTED spend — since the
# 2026-08-10 sizing fix a flat $10 per fire (clip/limit shares x limit),
# never released by the ledger. It was derived when a fire still committed
# $20: at the census's ~50 entries/day the earlier $1,200 bound at 60
# entries, inside one busy day, so $2,500 was ~2.5x that. At $10/fire the
# same $2,500 is ~5x the measured rate. LEFT AS IS deliberately — design
# §5.0 says a rail must not bind silently, and a looser rail cannot. Note it
# still over-counts real spend: fills happen at 1c under a 2c limit, and most
# FAKs zero-fill entirely.
daily_spend_cap_usd = 2500.0
concurrent_exposure_cap_usd = 150.0
per_order_cap_usd = 100.0

# CLOB-SETTLED realized P&L only — never gross spend (an earlier maker bug
# that made this kill inert). A losing FILL costs
# the $10 clip, so this is ~40 losing fills with no win. It LATCHES: recovery
# is an operator restart, not a timer.
realized_loss_kill_usd = 400.0

# A LATCH, not a rate limiter: the automaton fires at most ONE order per 300s
# slot (spec §3.6), so no 60s window can hold more than one send. A trip is
# proof of a state-machine fault, not a market condition.
self_fire_rate_per_min = 20

# Drop the held ladders when this slot's book WS has been silent this long.
book_stale_disarm_ms = 5000

# ---------------------------------------------------------------------------
# THE TRIGGER (spec §3.5) — the ONLY fire path. Extracted from the 696-slot
# census over Aug 7-9 (data/tickburst_posttwap_census/),
# the only entry that census found +EV at a 1c ask.
#
# On every Binance spot @aggTrade: if the trailing-1s volume is >= v_btc with
# >= lean_min of it in the trailing side's RECOVERY direction (taker SELLs for
# a trailing-Down entry, taker BUYs for trailing-Up), fire ONE FAK.
#
# DO NOT TUNE THESE while grading them (spec §7). The volume floor is a
# verified plateau over 0.5-1.0; everything else in the neighbourhood was
# measured and KILLED — near-tie D, depth, window durability, lean as a
# quiet-channel gate, 2c entries, re-arm, perp/OKX/bybit feeds. Spec §4 has
# the numbers and §7 the conditions under which any of them may reopen.
[strategy.tick]
enabled = true
v_btc = 0.5
lean_min = 0.6
window_ms = 1000

# A held book older than this is not acted on. 15s = the census's own
# staleness bound (census_surface.py's STALE_MS): the target IS a quiet 1c ask
# that can stand for 16s (spec §5's absorbed classes), so the earlier
# 500ms bound would suppress nearly every entry the census counted.
max_book_age_ms = 15000

# ---------------------------------------------------------------------------
# [live.*] — REQUIRED for --live, ignored by --dry-run. Uncomment and complete
# ALL FIVE sections; the shared validator (polymarket-client config/live.rs,
# Inv 1-11) fails closed on any missing field. Use a FRESH Magic.link proxy
# wallet dedicated to this strategy — never a wallet another bot also signs
# with. Keep the real file (config/tickburst.toml) out of git.
#
# [live.wallet]
# proxy_wallet = "0x…"            # Magic.link proxy (the address that holds pUSD)
# private_key = "0x…"             # the Magic.link EOA key that controls it
# signature_type = 1              # 1 = Magic.link POLY_PROXY (2 = Safe v1.3.0)
#
# [live.chain]
# rpc_url = "https://polygon-rpc.com"
# chain_id = 137
#
# [live.clob]
# http_base = "https://clob.polymarket.com"
# ws_url = "wss://ws-subscriptions-clob.polymarket.com"   # base; /ws/user appended
# signature_type = 1
#
# [live.api]
# key = "…"                       # CLOB API key (UUID)
# secret = "…"                    # base64
# passphrase = "…"
#
# [live.safety]
# cap_usd = 150.0                 # rolling-24h BUY cap (any positive value launches)
# kill_switch_loss_usd = 200.0    # daily loss halt — binds independently of cap_usd
# velocity_loss_per_hour = 50.0
# velocity_consecutive_hrs = 2
# skip_alternate_cids = false     # all five fields are required
